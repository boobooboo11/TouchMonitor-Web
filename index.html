<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Touch Monitor">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Touch Monitor</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#243247; background:white; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
    .app { width:100%; height:100vh; height:100dvh; display:flex; flex-direction:column;
      padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
    header { flex:none; height:48px; padding:0 14px; display:flex; align-items:center;
      justify-content:space-between; border-bottom:1px solid #e9edf1; }
    header span { font-size:14px; font-weight:700; letter-spacing:-.3px; }
    button { border:1px solid #dce3ec; background:white; color:#26364d; border-radius:9px;
      padding:7px 13px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; }
    button:active { background:#edf2fa; }
    #board { position:relative; flex:1; min-height:0; overflow:hidden; background:#fff;
      touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    canvas { display:block; width:100%; height:100%; pointer-events:none; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <span>Touch Monitor</span>
      <button id="reset" type="button">초기화</button>
    </header>
    <section id="board" aria-label="터치 궤적 영역">
      <canvas id="trail" aria-hidden="true"></canvas>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const board = document.getElementById('board');
      const canvas = document.getElementById('trail');
      const ctx = canvas.getContext('2d');
      // Key: Touch.identifier (브라우저 Touch ID). Release 뒤에도 경로는 남긴다.
      const paths = new Map();
      const colors = ['#2563eb', '#e54870', '#0b9f78', '#9958d4', '#dd8527', '#0896af', '#d65a4a'];
      let renderQueued = false;

      function getColor(id) {
        if (typeof id === 'number') return colors[((id % colors.length) + colors.length) % colors.length];
        return colors[0];
      }
      function pointOf(clientX, clientY) {
        const r = board.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(r.width, clientX - r.left)),
          y: Math.max(0, Math.min(r.height, clientY - r.top))
        };
      }
      function updatePath(id, clientX, clientY, phase) {
        // 이전 터치가 release된 뒤 같은 identifier가 다시 들어오면 이전 자취를 즉시 삭제.
        if (phase === 'start' || !paths.has(id)) {
          paths.set(id, { id:String(id), color:getColor(id), points:[], active:true });
        }
        const path = paths.get(id);
        path.points.push(pointOf(clientX,clientY));
        if (path.points.length > 3000) path.points.shift();
        path.active = phase !== 'end' && phase !== 'cancel';
        scheduleRender();
      }
      function scheduleRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => { renderQueued = false; render(); });
      }
      function drawIdLabel(x,y,label,color,w,h) {
        ctx.font = '600 12px -apple-system, BlinkMacSystemFont, sans-serif';
        const text = 'ID ' + label;
        const bw = Math.ceil(ctx.measureText(text).width) + 15;
        const bh = 23;
        const bx = Math.max(4, Math.min(w - bw - 4, x + 12));
        const by = Math.max(4, Math.min(h - bh - 4, y - 32));
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(bx,by,bw,bh,6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'middle';
        ctx.fillText(text,bx+7,by+bh/2);
      }
      function render() {
        const r = board.getBoundingClientRect();
        ctx.clearRect(0,0,r.width,r.height);
        for (const path of paths.values()) {
          const points = path.points;
          if (!points.length) continue;
          ctx.strokeStyle = path.color;
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (points.length > 1) {
            ctx.beginPath();
            ctx.moveTo(points[0].x,points[0].y);
            for (let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
            ctx.stroke();
          }
          const last = points[points.length-1];
          ctx.beginPath();
          ctx.arc(last.x,last.y,path.active ? 6 : 4,0,Math.PI*2);
          ctx.fillStyle = path.color;
          ctx.fill();
          if (path.active) {
            ctx.beginPath();
            ctx.arc(last.x,last.y,9,0,Math.PI*2);
            ctx.lineWidth = 1.4;
            ctx.strokeStyle = path.color;
            ctx.stroke();
          }
          drawIdLabel(last.x,last.y,path.id,path.color,r.width,r.height);
        }
      }
      function resize() {
        const r = board.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1,3);
        canvas.width = Math.max(1,Math.round(r.width*dpr));
        canvas.height = Math.max(1,Math.round(r.height*dpr));
        ctx.setTransform(dpr,0,0,dpr,0,0);
        scheduleRender();
      }
      for (const [eventName,phase] of [
        ['touchstart','start'], ['touchmove','move'],
        ['touchend','end'], ['touchcancel','cancel']
      ]) {
        board.addEventListener(eventName, event => {
          if (event.cancelable) event.preventDefault();
          for (const touch of event.changedTouches) {
            updatePath(touch.identifier,touch.clientX,touch.clientY,phase);
          }
        }, {passive:false});
      }
      // Windows 브라우저에서 마우스로 간단히 시험 가능.
      let mouseDown = false;
      board.addEventListener('mousedown', event => {
        if (event.button !== 0 || window.matchMedia('(pointer:coarse)').matches) return;
        mouseDown = true;
        updatePath('M',event.clientX,event.clientY,'start');
      });
      window.addEventListener('mousemove', event => {
        if (mouseDown) updatePath('M',event.clientX,event.clientY,'move');
      });
      window.addEventListener('mouseup', event => {
        if (!mouseDown) return;
        mouseDown = false;
        updatePath('M',event.clientX,event.clientY,'end');
      });
      document.getElementById('reset').addEventListener('click', () => {
        paths.clear();
        mouseDown = false;
        scheduleRender();
      });
      window.addEventListener('resize',resize);
      if ('ResizeObserver' in window) new ResizeObserver(resize).observe(board);
      resize();
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
    })();
  </script>
</body>
</html>
