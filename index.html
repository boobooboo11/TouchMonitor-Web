<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Touch Monitor">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <title>Touch Monitor</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#243247; background:#fff; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
    .app { width:100%; height:100vh; height:100dvh; display:flex; flex-direction:column;
      padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
    header { flex:none; background:#fff; border-bottom:1px solid #d9e4f2; }
    .bar { display:flex; align-items:center; justify-content:space-between; padding:7px 12px 6px; gap:12px; }
    .brand { display:flex; align-items:center; gap:8px; min-width:0; }
    .logo { flex:none; width:30px; height:30px; border-radius:10px; display:grid; place-items:center;
      color:#fff; font-size:18px; font-weight:800; background:#1378e8; }
    .brand strong { font-size:16px; font-weight:750; letter-spacing:-.35px; white-space:nowrap; }
    button { flex:none; border:1px solid #dce3ec; background:#fff; color:#26364d; border-radius:9px;
      padding:6px 11px; font-size:12px; font-weight:650; font-family:inherit; cursor:pointer; }
    button:active { background:#edf2fa; }
    .status-line { display:flex; align-items:center; gap:9px; padding:0 12px 7px; min-width:0; }
    .count { display:flex; align-items:center; gap:5px; flex:none; font-size:12px; color:#57677e; }
    .count b { font-size:13px; color:#172b48; font-variant-numeric:tabular-nums; }
    .statuses { flex:1; display:flex; align-items:center; gap:6px; min-width:0; overflow-x:auto;
      white-space:nowrap; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .statuses::-webkit-scrollbar { display:none; }
    .empty { font-size:11px; color:#9aa9ba; }
    .chip { flex:none; display:inline-flex; align-items:center; gap:5px; padding:3px 7px;
      border-radius:6px; font-size:11px; font-weight:700; background:#f5f7fa; }
    .dot { flex:none; width:7px; height:7px; border-radius:50%; background:currentColor; }
    #board { position:relative; flex:1; min-height:0; overflow:hidden;
      background-color:#fdfeff;
      background-image:linear-gradient(#e9f1fb 1px,transparent 1px),linear-gradient(90deg,#e9f1fb 1px,transparent 1px);
      background-size:24px 24px;
      touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    canvas { display:block; width:100%; height:100%; pointer-events:none; }
    @media (max-width:350px) { .brand strong {font-size:14px;} .bar {padding-inline:9px;} .status-line {padding-inline:9px;} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="bar">
        <div class="brand"><div class="logo" aria-hidden="true">T</div><strong>Touch Monitor</strong></div>
        <button id="reset" type="button">초기화</button>
      </div>
      <div class="status-line">
        <div class="count">터치 <b id="count">0</b></div>
        <div class="statuses" id="statuses" aria-label="ID별 터치 상태"><span class="empty">터치 대기</span></div>
      </div>
    </header>
    <section id="board" aria-label="격자 터치 궤적 영역">
      <canvas id="trail" aria-hidden="true"></canvas>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const board = document.getElementById('board');
      const canvas = document.getElementById('trail');
      const ctx = canvas.getContext('2d');
      const countEl = document.getElementById('count');
      const statusesEl = document.getElementById('statuses');
      const colors = ['#2563eb', '#e54870', '#0b9f78', '#9958d4', '#dd8527', '#0896af', '#d65a4a'];

      // Touch.identifier는 손가락이 닿아 있는 동안만 안정적인 브라우저 원본 ID다.
      // 화면 ID는 한 번의 터치 세션 안에서 1, 2, 3... 순서로 별도 발급한다.
      // 세션 = 처음 DOWN부터 모든 손가락이 RELEASE/CANCEL될 때까지.
      const active = new Map(); // 원본 Touch.identifier -> 화면 ID
      const paths = new Map();  // 화면 ID -> {id, color, points, active, phase}
      let nextDisplayId = 1;
      let renderQueued = false;
      let mouseDown = false;
      let lastTouchTime = 0;

      const colorFor = id => colors[(id - 1) % colors.length];

      function startNewSessionIfIdle() {
        // RELEASE만으로는 지우지 않는다. 모든 손가락이 없어진 다음
        // 새로운 첫 DOWN이 들어오는 순간에만 이전 세션의 궤적을 전체 삭제.
        if (active.size !== 0) return;
        paths.clear();
        nextDisplayId = 1;
      }
      function pointOf(clientX, clientY) {
        const r = board.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(r.width, clientX - r.left)),
          y: Math.max(0, Math.min(r.height, clientY - r.top))
        };
      }
      function updatePath(rawId, clientX, clientY, phase) {
        let id = active.get(rawId);
        if (id === undefined) {
          // 시작 이벤트가 없는 MOVE/RELEASE로 가짜 경로를 만들지 않는다.
          if (phase !== 'DOWN') return;
          id = nextDisplayId++;
          active.set(rawId, id);
          // 세션 중에는 RELEASE된 경로도 보존한다. 화면 ID 재사용 없음.
          paths.set(id, {id, color:colorFor(id), points:[], active:true, phase:'DOWN'});
        }
        const path = paths.get(id);
        path.points.push(pointOf(clientX, clientY));
        if (path.points.length > 3000) path.points.shift();
        path.phase = phase;
        path.active = phase !== 'RELEASE' && phase !== 'CANCEL';
        if (!path.active) active.delete(rawId);
        scheduleRender();
      }
      function scheduleRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => { renderQueued = false; render(); });
      }
      function drawIdLabel(x, y, id, color, w, h) {
        ctx.font = '700 12px -apple-system, BlinkMacSystemFont, sans-serif';
        const text = 'ID ' + id;
        const bw = Math.ceil(ctx.measureText(text).width) + 15;
        const bh = 23;
        const bx = Math.max(4, Math.min(w - bw - 4, x + 12));
        const by = Math.max(4, Math.min(h - bh - 4, y - 32));
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, bx + 7, by + bh/2);
      }
      function renderHeader() {
        countEl.textContent = String(active.size);
        statusesEl.replaceChildren();
        if (paths.size === 0) {
          const empty = document.createElement('span');
          empty.className = 'empty';
          empty.textContent = '터치 대기';
          statusesEl.appendChild(empty);
          return;
        }
        for (const path of [...paths.values()].sort((a,b) => a.id - b.id)) {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.style.color = path.color;
          const dot = document.createElement('span');
          dot.className = 'dot';
          chip.appendChild(dot);
          chip.appendChild(document.createTextNode('ID ' + path.id + ': ' + path.phase));
          statusesEl.appendChild(chip);
        }
      }
      function render() {
        const r = board.getBoundingClientRect();
        ctx.clearRect(0, 0, r.width, r.height);
        for (const path of paths.values()) {
          const points = path.points;
          if (!points.length) continue;
          ctx.strokeStyle = path.color;
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (points.length > 1) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
          }
          const last = points[points.length-1];
          ctx.beginPath();
          ctx.arc(last.x, last.y, path.active ? 6 : 4, 0, Math.PI*2);
          ctx.fillStyle = path.color;
          ctx.fill();
          if (path.active) {
            ctx.beginPath();
            ctx.arc(last.x, last.y, 9, 0, Math.PI*2);
            ctx.lineWidth = 1.4;
            ctx.strokeStyle = path.color;
            ctx.stroke();
          }
          drawIdLabel(last.x, last.y, path.id, path.color, r.width, r.height);
        }
        renderHeader();
      }
      function resize() {
        const r = board.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.max(1, Math.round(r.width*dpr));
        canvas.height = Math.max(1, Math.round(r.height*dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        scheduleRender();
      }
      for (const [eventName, phase] of [
        ['touchstart','DOWN'], ['touchmove','MOVE'],
        ['touchend','RELEASE'], ['touchcancel','CANCEL']
      ]) {
        board.addEventListener(eventName, event => {
          lastTouchTime = Date.now();
          if (event.cancelable) event.preventDefault();
          if (phase === 'DOWN' && event.changedTouches.length > 0) {
            startNewSessionIfIdle();
          }
          for (const touch of event.changedTouches) {
            updatePath(touch.identifier, touch.clientX, touch.clientY, phase);
          }
        }, {passive:false});
      }
      // Windows 브라우저용 마우스 테스트도 ID 1부터 시작한다.
      board.addEventListener('mousedown', event => {
        if (event.button !== 0 || Date.now() - lastTouchTime < 900) return;
        startNewSessionIfIdle();
        mouseDown = true;
        updatePath('mouse', event.clientX, event.clientY, 'DOWN');
      });
      window.addEventListener('mousemove', event => {
        if (mouseDown) updatePath('mouse', event.clientX, event.clientY, 'MOVE');
      });
      window.addEventListener('mouseup', event => {
        if (!mouseDown) return;
        mouseDown = false;
        updatePath('mouse', event.clientX, event.clientY, 'RELEASE');
      });
      document.getElementById('reset').addEventListener('click', () => {
        active.clear();
        paths.clear();
        nextDisplayId = 1;
        mouseDown = false;
        scheduleRender();
      });
      window.addEventListener('resize', resize);
      if ('ResizeObserver' in window) new ResizeObserver(resize).observe(board);
      resize();
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
    })();
  </script>
</body>
</html>
